nordpool_palikka:
  module: nordpool_palikka
  class: NordpoolPalikka

  # Nord Pool -integraation config entry
  # (Kehitystyökalut > Toiminnot, valitse Nord Pool -toiminto, katso YAML)
  config_entry: "01K6Q3ZD26J6C7WDHW7D1HBNZC"
  area: "FI"
  currency: "EUR"

  # Hintalaskennan parametrit
  vat: 0.255              # ALV, 25,5 %
  margin: 0.49             # Nord Pool -marginaali, c/kWh
  transfer: 4.83           # siirtomaksu, c/kWh (sis. ALV)
  tax: 2.91788              # sähkövero, c/kWh (sis. ALV)

  # Analyysiparametrit
  cheap_quarter_pct: 0.25
  cheap_third_pct: 0.3333
  expensive_third_pct: 0.3333
  expensive_quarter_pct: 0.25
  price_epsilon: 0.01       # c/kWh, tasapelien tunnistukseen
  history_retention_hours: 2  # kuinka paljon menneisyyttä säilytetään graafia varten

  # Tallennuspolut
  state_file: "/config/appdaemon/apps/NordpoolPalikka/state.json"
  public_json_file: "/config/www/nordpool_price_series.json"
